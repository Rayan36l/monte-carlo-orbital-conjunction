[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-orbital-conjunction"
version = "0.1.0"
description = "RK4 orbital propagation, bisection TCA solver, and Monte Carlo satellite collision probability estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
